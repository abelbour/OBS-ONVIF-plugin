name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        default: RelWithDebInfo
        options:
          - RelWithDebInfo
          - Release
          - Debug
  schedule:
    # Nightly status monitor: catches dependency availability and toolchain
    # drift against OBS deps between active development cycles.
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Build for Windows x64 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore build dependencies ⬇️
        uses: actions/cache/restore@v4
        id: deps-cache
        with:
          path: .deps
          key: deps-obsdeps-${{ hashFiles('buildspec.json') }}-x64
          restore-keys: deps-obsdeps-x64

      - name: Build Plugin 🧱
        shell: pwsh
        run: |
          ./.github/scripts/Build-Windows.ps1 -Configuration '${{ inputs.configuration || 'RelWithDebInfo' }}'

      - name: Package Plugin 📦
        shell: pwsh
        run: |
          ./.github/scripts/Package-Windows.ps1 -Configuration '${{ inputs.configuration || 'RelWithDebInfo' }}'

      - name: Save build dependencies 💾
        uses: actions/cache/save@v4
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: .deps
          key: deps-obsdeps-${{ hashFiles('buildspec.json') }}-x64

      - name: Verify installed layout ✔️
        shell: pwsh
        run: |
          $expected = @(
            'release/RelWithDebInfo/obs-onvif/bin/64bit/obs-onvif.dll',
            'release/RelWithDebInfo/obs-onvif/data/locale/en-US.ini'
          )
          foreach ($p in $expected) {
            if (-not (Test-Path $p)) {
              Write-Error "Missing expected plugin file: $p"
              exit 1
            }
            Write-Host "OK: $p"
          }
          $zip = Get-ChildItem 'release/obs-onvif-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { Write-Error 'No plugin zip produced'; exit 1 }
          Write-Host "ZIP: $($zip.FullName) ($($zip.Length) bytes)"

      - name: Upload artifact 📡
        uses: actions/upload-artifact@v4
        with:
          name: obs-onvif-win64
          path: |
            release/RelWithDebInfo/
            release/obs-onvif-*-windows-x64.zip
          if-no-files-found: error

  notify:
    name: Notify build failure 🔔
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: windows-build
    permissions:
      pull-requests: write
    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `❌ **Build failed** on this pull request.\n\nSee the [workflow run](${runUrl}) for logs.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  release:
    name: Draft release on tag 🏷️
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-onvif-win64
          path: dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
          files: dist/**/*.zip