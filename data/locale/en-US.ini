Settings.FirewallHint="<b>Multicast needs a firewall rule once — it then persists across reboots.</b><br/>Windows Firewall drops unsolicited multicast replies from cameras on UDP 3702 unless a rule allows them.<ol><li>Run OBS as Administrator once: the plugin installs the <i>obs-onvif-discovery</i> rule automatically.</li><li>Or in Windows Defender Firewall &gt; Advanced settings &gt; Inbound Rules &gt; New Rule choose <b>Port &gt; UDP 3702 &gt; Allow the connection</b>, tick Domain/Private/Public, and finish.</li><li>Or run once as Administrator: <tt>netsh advfirewall firewall add rule name=\"obs-onvif-discovery\" dir=in action=allow protocol=UDP localport=3702</tt></li></ol><i>Needed once; afterwards run OBS normally.</i>"
