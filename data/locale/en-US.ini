Settings.PtzStopQueued="Queued (finish current move first)"
Settings.PtzMinInterval="Minimum interval between moves"
Settings.PtzHint="Immediate stop aborts the in-flight movement request so the camera stops within one round trip; Queued lets the current move complete first. A move timeout bounds each command and the plugin re-fires while a button is held (0 = move until Stop)."

